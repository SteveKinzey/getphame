<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFE04A"/>
      <stop offset="50%"  stop-color="#F5A800"/>
      <stop offset="100%" stop-color="#B87000"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#FFFDE8"/>
      <stop offset="60%"  stop-color="#FFE680"/>
      <stop offset="100%" stop-color="#FFD000"/>
    </linearGradient>
  </defs>

  <!-- Dark navy background with rounded corners -->
  <rect width="512" height="512" rx="90" fill="#0C0C1A"/>

  <!--
    P letterform — even-odd so the counter (bowl interior) is transparent.
    Outer path: stem + outer bowl arc
    Inner path (counter): the open space inside the bowl
    
    Original logo analysis:
    - Stem: left side, x=130–190, full height y=88–430
    - Bowl: upper right, outer arc from y=88 to y=290, right edge ~x=360
    - Counter (hole): x=190–310, y=130–260 (rounded rect)
    - Sparkle: inside the counter, center ~(290, 175)
    - Bottom of stem: small downward notch at y=430
  -->

  <!-- P outer shape (stem + bowl) -->
  <path
    fill="url(#goldGrad)"
    d="
      M 130 88
      L 130 430
      L 175 430
      L 175 295
      L 248 295
      Q 360 295 368 198
      Q 373 140 335 108
      Q 308 88 258 88
      Z
    "
  />

  <!-- Counter (bowl interior hole) — same color as background to cut through -->
  <path
    fill="#0C0C1A"
    d="
      M 175 128
      L 248 128
      Q 316 128 322 194
      Q 326 240 292 258
      Q 272 268 248 268
      L 175 268
      Z
    "
  />



  <!--
    4-point sparkle — positioned inside the bowl counter opening
    Center at (285, 175) — upper-right inside the bowl hole
    Vertical spike: tall (y 118 to 232), narrow (x ±8)
    Horizontal spike: wide (x 238 to 332), narrow (y ±7)
  -->
  <!-- Vertical spike -->
  <polygon
    points="285,118  293,170  285,232  277,170"
    fill="url(#sparkleGrad)"
  />
  <!-- Horizontal spike -->
  <polygon
    points="238,175  280,168  332,175  280,182"
    fill="url(#sparkleGrad)"
  />
</svg>
