# fly.toml — GetPhame landing page
# Deploy with: flyctl deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "getphame"
primary_region = "ord"  # Chicago — change to your preferred region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
