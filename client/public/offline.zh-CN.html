<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#101b3f" /><title>离线 — Get Phame</title><link rel="stylesheet" href="/offline.css" /></head>
  <body><main><section class="offline-card" aria-labelledby="offline-title"><div class="lockup" aria-label="GET PHAME"><img class="brand-mark" src="/apple-touch-icon.png" alt="" width="52" height="52" /><span class="wordmark">GET PHAME</span></div><div class="signal" aria-hidden="true"><span></span><span></span><span></span><i></i></div><p class="eyebrow">需要网络连接</p><h1 id="offline-title">您当前处于离线状态</h1><p class="intro">Get Phame 目前无法连接到互联网。请检查网络连接，然后重试以返回您的评价管理面板。</p><div class="recovery-card"><p class="recovery-title">您可以这样做</p><ul class="recovery-list"><li>检查 Wi-Fi 或移动数据网络。</li><li>请保持此标签页打开；您的账户数据不会被更改。</li></ul></div><button id="retry" type="button" data-reconnecting-label="正在检查网络连接…" data-offline-message="您的账户数据未被更改。" data-online-message="已检测到网络连接。请重试以返回 Get Phame。" data-reconnecting-message="正在检查您的网络连接…"><span class="retry-label">重试</span></button><p id="connection-status" class="hint" role="status" aria-live="polite">您的账户数据未被更改。</p></section></main><script>(() => { const button = document.getElementById('retry'); const label = button.querySelector('.retry-label'); const status = document.getElementById('connection-status'); const setConnectionState = () => { status.textContent = navigator.onLine ? button.dataset.onlineMessage : button.dataset.offlineMessage; }; button.addEventListener('click', () => { button.disabled = true; label.textContent = button.dataset.reconnectingLabel; status.textContent = button.dataset.reconnectingMessage; window.setTimeout(() => window.location.reload(), 80); }); window.addEventListener('online', setConnectionState); window.addEventListener('offline', setConnectionState); setConnectionState(); })();</script></body>
</html>
