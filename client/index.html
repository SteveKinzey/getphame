    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Get Phame",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Send personalized review requests from your own email account. Get more 5-star Google reviews without the awkward ask.",
      "url": "https://getphame.app",
      "offers": [
        { "@type": "Offer", "name": "Free Plan", "price": "0", "priceCurrency": "USD", "description": "10 review requests included" },
        { "@type": "Offer", "name": "Pro Monthly", "price": "29", "priceCurrency": "USD", "description": "Unlimited review requests" },
        { "@type": "Offer", "name": "Pro Annual", "price": "19", "priceCurrency": "USD", "description": "Billed annually at $228/year" },
        { "@type": "Offer", "name": "Lifetime", "price": "349", "priceCurrency": "USD", "description": "One-time payment, lifetime access" }
      ],
      "provider": {
        "@type": "Organization",
        "name": "Get Phame",
        "url": "https://getphame.app"
      }
    }
    </script>
    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "Is my email password safe?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Your SMTP password is encrypted using AES-256-GCM before storage. Never logged or shared." } },
        { "@type": "Question", "name": "Will this hurt my email deliverability?", "acceptedAnswer": { "@type": "Answer", "text": "No. Emails are sent individually from your own account, not in bulk blasts." } },
        { "@type": "Question", "name": "What email providers are supported?", "acceptedAnswer": { "@type": "Answer", "text": "Gmail, Google Workspace, Outlook/Microsoft 365, Yahoo, Zoho, iCloud, and any SMTP server." } },
        { "@type": "Question", "name": "Is this compliant with review platform guidelines?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Get Phame sends a link to your review page without incentivizing or filtering reviews." } },
        { "@type": "Question", "name": "Can I cancel anytime?", "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. No contracts, no cancellation fees. Cancel anytime from account settings." } }
      ]
    }
    </script>
