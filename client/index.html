    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is my email password safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your SMTP password is encrypted using AES-256-GCM before it's stored. It's never logged, displayed in full, or transmitted to any third party."
          }
        },
        {
          "@type": "Question",
          "name": "Will this hurt my email deliverability?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Emails are sent individually from your own account, not in bulk blasts. They look like normal personal emails to spam filters."
          }
        },
        {
          "@type": "Question",
          "name": "What email providers are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Get Phame works with any SMTP-compatible email provider including Gmail, Google Workspace, Outlook/Microsoft 365, Yahoo, Zoho, iCloud, and custom SMTP servers."
          }
        },
        {
          "@type": "Question",
          "name": "Is this compliant with review platform guidelines?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Get Phame sends a link to your review page — it doesn't incentivize, gate, or filter reviews. This is compliant with Google, Yelp, and other major platform guidelines."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. No contracts, no cancellation fees. Cancel your subscription anytime from your account settings."
          }
        }
      ]
    }
    </script>
