name: Monthly Workflow Drift Audit

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-workflow-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit GitHub Actions configuration
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit repository workflow contracts
        run: node scripts/audit-github-actions.mjs

      - name: Verify repository auto-merge remains enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          enabled="$(
            gh api graphql \
              -f query="query(\$owner: String!, \$name: String!) { repository(owner: \$owner, name: \$name) { autoMergeAllowed } }" \
              -F owner="$owner" \
              -F name="$name" \
              --jq '.data.repository.autoMergeAllowed'
          )"
          if [ "$enabled" != "true" ]; then
            echo "Repository auto-merge drift detected: autoMergeAllowed=${enabled:-unavailable}"
            exit 1
          fi
          echo "Repository auto-merge remains enabled."

      - name: Run actionlint with shellcheck and pyflakes
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
