name: Monthly Workflow Drift Audit

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-workflow-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit GitHub Actions configuration
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit repository workflow contracts
        run: node scripts/audit-github-actions.mjs

      - name: Verify repository auto-merge remains enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allow_auto_merge="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')"
          if [ "$allow_auto_merge" != "true" ]; then
            echo "Repository auto-merge is disabled; eligible Dependabot patches cannot merge automatically."
            exit 1
          fi

      - name: Run actionlint with shellcheck and pyflakes
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
