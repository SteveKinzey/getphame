name: Apply verified GetPhame fixes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-getphame-fixes
  cancel-in-progress: false

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Revert malformed flattened-path upload
        run: git revert --no-edit a29b96966130c1bc4fb5db157a1f283b68164331

      - name: Download and verify path-correct fix archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://files.manuscdn.com/user_upload_by_module/session_file/310519663507659115/QPhXZsPYchwvIxss.zip" \
            --output /tmp/getphame-fixes.zip
          echo "b23d9a7eaed4425bd4215007451cb1bf4105e98da593d466a944c8061844bb43  /tmp/getphame-fixes.zip" | sha256sum --check --strict

      - name: Apply verified files at repository-relative paths
        run: |
          unzip -o /tmp/getphame-fixes.zip -d .
          git add -A

      - name: Commit and push corrected main
        run: |
          git commit \
            -m "fix: resolve all functionality test issues - PayPal routes, accessibility, translations, legal, images, Apple auth" \
            -m "Registers PayPal routes, completes legal and product localization, addresses WCAG accessibility and CSP findings, restores verified R2 product imagery, and enables Apple Sign-In on production hosts."
          git push origin HEAD:main
