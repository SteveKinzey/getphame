overrides:
  # Security: path-to-regexp ReDoS fix (express 4 uses 0.1.x)
  path-to-regexp: ">=0.1.13"
  # Security: nodemailer raw message bypass fix (direct dep upgraded to v9)
  nodemailer: ">=9.0.1"
  # Security: invalid size-limit value can disable body enforcement
  body-parser: "1.20.6"
  # Security: tar arbitrary file write fix (GHSA-r292-9mhp-454m)
  tar: ">=7.5.22"
  # Security: PostCSS source map path traversal and local file disclosure fix (GHSA-r28c-9q8g-f849)
  postcss: ">=8.5.18"
  # Security: picomatch ReDoS fix
  picomatch: ">=4.0.4"
  # Security: lodash code injection fix (lodash-es still pulled by dagre-d3-es via mermaid)
  lodash: ">=4.18.0"
  lodash-es: ">=4.18.0"
  # Security: fast-xml-builder attribute injection fix
  fast-xml-builder: ">=1.1.7"
  # Security: fast-xml-parser attribute injection fix
  fast-xml-parser: ">=5.7.0"
  # Security: form-data CRLF injection fix
  form-data: ">=4.0.6"
  # Security: dompurify XSS fix (mermaid pulls an older advisory-affected release)
  dompurify: "3.4.12"
  # Security: mermaid XSS fix (streamdown pulls 11.12.x, needs >=11.15.0)
  mermaid: ">=11.15.0"
  # Security: esbuild dev server request smuggling fix
  esbuild: ">=0.28.1"
  # Security: follow-redirects URL leak fix
  follow-redirects: ">=1.16.0"
  # Security: uuid entropy fix
  uuid: ">=11.1.1"
  # Security: qs prototype pollution fix
  qs: ">=6.15.2"
  # Security: brace-expansion unbounded-length DoS fix (GHSA-mh99-v99m-4gvg)
  brace-expansion: ">=5.0.8"
  # Security: mdast-util-to-hast XSS fix
  mdast-util-to-hast: ">=13.2.1"
  # Existing overrides preserved
  tailwindcss>nanoid: "3.3.7"
  baseline-browser-mapping: "^2.10.20"
  rollup: "^4.52.5"

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch
